name: MNYTC Multi-Platform Build

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release after successful builds
        required: true
        type: boolean
        default: false

  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: mnytc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  validate:
    name: Validate Flutter project
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Show Flutter environment
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Verify required project files
        shell: bash
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/app.dart
          test -f lib/config/app_config.dart
          test -f lib/screens/webview_screen.dart
          test -f lib/services/download_service.dart
          test -f lib/widgets/loading_view.dart
          test -f lib/widgets/offline_view.dart
          test -f assets/icons/Monytccc.png
          test -f android/app/src/main/AndroidManifest.xml
          test -f test/app_test.dart
          test -d android
          test -d ios
          test -d windows
          test -d macos

      - name: Clean Flutter project
        run: flutter clean

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Format Dart source code
        run: dart format lib test

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  android:
    name: Build Android APK and AAB
    needs:
      - validate

    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Show Flutter and Java versions
        run: |
          flutter --version
          java -version

      - name: Clean Flutter project
        run: flutter clean

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate native splash screen
        run: dart run flutter_native_splash:create

      - name: Build release APK
        run: |
          flutter build apk \
            --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}

      - name: Build release Android App Bundle
        run: |
          flutter build appbundle \
            --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}

      - name: Collect Android build files
        shell: bash
        run: |
          mkdir -p dist/android

          test -f build/app/outputs/flutter-apk/app-release.apk
          test -f build/app/outputs/bundle/release/app-release.aab

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            dist/android/MNYTC-${{ github.run_number }}.apk

          cp \
            build/app/outputs/bundle/release/app-release.aab \
            dist/android/MNYTC-${{ github.run_number }}.aab

          sha256sum \
            dist/android/MNYTC-${{ github.run_number }}.apk \
            dist/android/MNYTC-${{ github.run_number }}.aab \
            > dist/android/SHA256SUMS.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MNYTC-Android-${{ github.run_number }}
          path: dist/android
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Build Windows application
    needs:
      - validate

    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Show Flutter environment
        run: flutter doctor -v

      - name: Clean Flutter project
        run: flutter clean

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build Windows release
        run: >
          flutter build windows
          --release
          --build-name=1.0.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - name: Package complete Windows application
        shell: pwsh
        run: |
          $releaseDirectory = "build/windows/x64/runner/Release"
          $outputDirectory = "dist/windows"
          $outputArchive = "$outputDirectory/MNYTC-Windows-${{ github.run_number }}.zip"

          if (-not (Test-Path $releaseDirectory)) {
            throw "Windows release directory was not found: $releaseDirectory"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $outputDirectory |
          Out-Null

          Compress-Archive `
            -Path "$releaseDirectory/*" `
            -DestinationPath $outputArchive `
            -Force

          $hash = Get-FileHash `
            -Path $outputArchive `
            -Algorithm SHA256

          "$($hash.Hash)  $($hash.Path | Split-Path -Leaf)" |
          Set-Content "$outputDirectory/SHA256SUMS.txt"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MNYTC-Windows-${{ github.run_number }}
          path: dist/windows
          if-no-files-found: error
          retention-days: 30

  apple:
    name: Build macOS and unsigned iOS
    needs:
      - validate

    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Show Flutter and Xcode environment
        run: |
          flutter --version
          flutter doctor -v
          xcodebuild -version

      - name: Clean Flutter project
        run: flutter clean

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate native splash screen
        run: dart run flutter_native_splash:create

      - name: Build macOS release
        run: |
          flutter build macos \
            --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}

      - name: Build unsigned iOS release
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}

      - name: Package Apple validation builds
        shell: bash
        run: |
          mkdir -p dist/apple

          MACOS_APPLICATION="$(find \
            build/macos/Build/Products/Release \
            -maxdepth 1 \
            -type d \
            -name '*.app' \
            -print \
            -quit)"

          if [ -z "$MACOS_APPLICATION" ]; then
            echo "No macOS application bundle was found."
            exit 1
          fi

          if [ ! -d build/ios/iphoneos/Runner.app ]; then
            echo "The unsigned iOS Runner.app was not found."
            exit 1
          fi

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$MACOS_APPLICATION" \
            dist/apple/MNYTC-macOS-unsigned-${{ github.run_number }}.zip

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            build/ios/iphoneos/Runner.app \
            dist/apple/MNYTC-iOS-unsigned-${{ github.run_number }}.zip

          shasum \
            -a 256 \
            dist/apple/*.zip \
            > dist/apple/SHA256SUMS.txt

      - name: Upload Apple artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MNYTC-Apple-unsigned-${{ github.run_number }}
          path: dist/apple
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs:
      - android
      - windows
      - apple

    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (
        github.event_name == 'workflow_dispatch' &&
        inputs.create_release == true
      )

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Display release files
        shell: bash
        run: find release-assets -type f -print

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MNYTC ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**/*

      - name: Publish manually requested GitHub Release
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.create_release == true &&
          !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MNYTC Build ${{ github.run_number }}
          generate_release_notes: true
          files: release-assets/**/*