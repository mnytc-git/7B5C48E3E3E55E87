name: MNYTC Multi-Platform Build

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: mnytc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  APP_NAME: MNYTC

jobs:
  validate:
    name: Validate Flutter project
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Verify required files
        shell: bash
        run: |
          required_files=(
            pubspec.yaml
            lib/main.dart
            lib/app.dart
            lib/config/app_config.dart
            lib/screens/webview_screen.dart
            lib/services/download_service.dart
            lib/widgets/loading_view.dart
            lib/widgets/offline_view.dart
            assets/icons/Monytccc.png
            android/app/src/main/AndroidManifest.xml
          )
          failed=0
          for item in "${required_files[@]}"; do
            if [ -f "$item" ]; then
              echo "FOUND: $item"
            else
              echo "MISSING: $item"
              failed=1
            fi
          done
          exit "$failed"

      - name: Clean project
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Format Dart code
        shell: bash
        run: |
          if [ -d test ]; then
            dart format lib test
          else
            dart format lib
          fi

      - name: Analyze project
        continue-on-error: true
        run: flutter analyze

      - name: Run tests when present
        if: ${{ hashFiles('test/**/*.dart') != '' }}
        continue-on-error: true
        run: flutter test

  android:
    name: Build Android APK and AAB
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Clean project
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android scaffold when incomplete
        shell: bash
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/app/build.gradle.kts ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
            if [ -f android/app/src/main/kotlin/eu/mnytc/app/MainActivity.kt ]; then
              cp android/app/src/main/kotlin/eu/mnytc/app/MainActivity.kt /tmp/MainActivity.kt
            fi
            flutter create --platforms=android --org eu.mnytc --project-name mnytc .
            cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            if [ -f /tmp/MainActivity.kt ]; then
              mkdir -p android/app/src/main/kotlin/eu/mnytc/app
              cp /tmp/MainActivity.kt android/app/src/main/kotlin/eu/mnytc/app/MainActivity.kt
            fi
          fi

      - name: Generate Android icons only
        shell: bash
        run: |
          cat > launcher_icons_android.yaml <<'YAML'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: assets/icons/Monytccc.png
            adaptive_icon_background: "#000000"
            adaptive_icon_foreground: assets/icons/Monytccc.png
            min_sdk_android: 21
          YAML
          dart run flutter_launcher_icons -f launcher_icons_android.yaml

      - name: Generate Android splash screen
        run: dart run flutter_native_splash:create

      - name: Build APK
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Build AAB
        run: flutter build appbundle --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Collect Android artifacts
        shell: bash
        run: |
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-release.apk dist/android/MNYTC-${{ github.run_number }}.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/android/MNYTC-${{ github.run_number }}.aab
          sha256sum dist/android/* > dist/android/SHA256SUMS.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MNYTC-Android-${{ github.run_number }}
          path: dist/android
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Build Windows application
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Clean project
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Windows scaffold when incomplete
        shell: pwsh
        run: |
          if (-not (Test-Path "windows/CMakeLists.txt")) {
            flutter create --platforms=windows --org eu.mnytc --project-name mnytc .
          }

      - name: Generate Windows icon only
        shell: pwsh
        run: |
          @"
          flutter_launcher_icons:
            android: false
            ios: false
            image_path: assets/icons/Monytccc.png
            windows:
              generate: true
              image_path: assets/icons/Monytccc.png
              icon_size: 256
          "@ | Set-Content launcher_icons_windows.yaml
          dart run flutter_launcher_icons -f launcher_icons_windows.yaml

      - name: Build Windows application
        run: flutter build windows --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Package Windows application
        shell: pwsh
        run: |
          $releaseDirectory = "build/windows/x64/runner/Release"
          if (-not (Test-Path $releaseDirectory)) {
            throw "Windows release directory not found: $releaseDirectory"
          }
          New-Item -ItemType Directory -Force -Path "dist/windows" | Out-Null
          Compress-Archive -Path "$releaseDirectory/*" -DestinationPath "dist/windows/MNYTC-Windows-${{ github.run_number }}.zip" -Force
          $hash = Get-FileHash "dist/windows/MNYTC-Windows-${{ github.run_number }}.zip" -Algorithm SHA256
          "$($hash.Hash)  MNYTC-Windows-${{ github.run_number }}.zip" | Set-Content "dist/windows/SHA256SUMS.txt"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MNYTC-Windows-${{ github.run_number }}
          path: dist/windows
          if-no-files-found: error
          retention-days: 30

  apple:
    name: Build macOS and unsigned iOS
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Clean project
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Apple scaffolds when incomplete
        shell: bash
        run: |
          if [ ! -d ios/Runner/Assets.xcassets/AppIcon.appiconset ] || [ ! -f ios/Runner/Info.plist ]; then
            flutter create --platforms=ios --org eu.mnytc --project-name mnytc .
          fi
          if [ ! -d macos/Runner/Assets.xcassets/AppIcon.appiconset ] || [ ! -f macos/Runner/Info.plist ]; then
            flutter create --platforms=macos --org eu.mnytc --project-name mnytc .
          fi

      - name: Generate Apple icons only
        shell: bash
        run: |
          cat > launcher_icons_apple.yaml <<'YAML'
          flutter_launcher_icons:
            android: false
            ios: true
            image_path: assets/icons/Monytccc.png
            remove_alpha_ios: true
            macos:
              generate: true
              image_path: assets/icons/Monytccc.png
          YAML
          dart run flutter_launcher_icons -f launcher_icons_apple.yaml

      - name: Generate Apple splash screen
        run: dart run flutter_native_splash:create

      - name: Build macOS application
        run: flutter build macos --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Build unsigned iOS application
        run: flutter build ios --release --no-codesign --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Package Apple applications
        shell: bash
        run: |
          mkdir -p dist/apple
          macos_app="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$macos_app"
          test -d build/ios/iphoneos/Runner.app
          ditto -c -k --sequesterRsrc --keepParent "$macos_app" dist/apple/MNYTC-macOS-unsigned-${{ github.run_number }}.zip
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app dist/apple/MNYTC-iOS-unsigned-${{ github.run_number }}.zip
          shasum -a 256 dist/apple/*.zip > dist/apple/SHA256SUMS.txt

      - name: Upload Apple artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MNYTC-Apple-unsigned-${{ github.run_number }}
          path: dist/apple
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs:
      - android
      - windows
      - apple
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish version-tag release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MNYTC ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/**/*

      - name: Publish manually requested release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true && !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MNYTC Build ${{ github.run_number }}
          generate_release_notes: true
          files: release-assets/**/*